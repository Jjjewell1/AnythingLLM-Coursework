services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.anythingllm.rule=Host(`study.jewellcore.com`)
      - traefik.http.routers.anythingllm.entrypoints=http
      - traefik.http.services.anythingllm.loadbalancer.server.port=3001
    environment:
      - STORAGE_DIR=/app/server/storage
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_API_KEY=${GEMINI_EMBEDDING_API_KEY}
      - LLM_PROVIDER=gemini
      - GEMINI_LLM_MODEL_PREF=gemini-3.5-flash-lite
      - EMBEDDING_ENGINE=gemini
      - EMBEDDING_MODEL_PREF=gemini-embedding-001
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
      - VECTOR_DB=lancedb
    volumes:
      - anythingllm_data:/app/server/storage

volumes:
  anythingllm_data: {}

networks:
  coolify:
    external: true
